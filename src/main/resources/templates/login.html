<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | ForensiChain</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <style>

        body {
            min-height: 100vh;
            margin: 0;
            background: #eef2f7;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #1f2937;
        }

        .navbar {
            background: linear-gradient(135deg, #111827, #1e3a8a) !important;
            padding: 16px 0;
        }

        .navbar-brand {
            font-size: 1.35rem;
            letter-spacing: .3px;
        }

        .login-card {
            max-width: 520px;
            margin: 70px auto;
            border: none;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,.10);
        }

        .login-header {
            background: linear-gradient(135deg, #1e3a8a, #2563eb);
            color: white;
            text-align: center;
            padding: 32px 25px;
        }

        .login-icon {
            font-size: 58px;
        }

        .login-header h2 {
            font-weight: 700;
            margin-top: 10px;
        }

        .login-header p {
            margin-bottom: 0;
            opacity: .9;
        }

        .card-body {
            padding: 35px;
        }

        .form-label {
            font-weight: 600;
        }

        .form-control {
            border-radius: 9px;
            padding: 11px 13px;
        }

        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,.12);
        }

        .btn-login {
            background: linear-gradient(135deg, #1e3a8a, #2563eb);
            color: white;
            border: none;
            border-radius: 9px;
            padding: 12px;
            font-weight: 600;
        }

        .btn-login:hover {
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(37,99,235,.25);
        }

        .btn-upload {
            border-radius: 9px;
            font-weight: 500;
        }

        .security-box {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e40af;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 25px;
        }

        .security-box i {
            font-size: 20px;
        }

        .footer {
            text-align: center;
            color: #6b7280;
            margin-top: 30px;
            padding-bottom: 30px;
            font-size: .9rem;
        }

    </style>

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-dark shadow">

    <div class="container">

        <a href="/"
           class="navbar-brand text-white text-decoration-none">

            <i class="bi bi-shield-lock-fill me-2"></i>

            <b>ForensiChain</b>

        </a>

        <span class="text-light">
            Digital Evidence Investigation Platform
        </span>

    </div>

</nav>


<!-- LOGIN -->

<div class="container">

    <div class="card login-card">

        <div class="login-header">

            <i class="bi bi-shield-lock-fill login-icon"></i>

            <h2>Welcome Back</h2>

            <p>Secure Investigator Login</p>

        </div>


        <div class="card-body">

            <div class="security-box">

                <i class="bi bi-shield-check me-2"></i>

                <strong>Secure Access</strong>

                <div class="small mt-1">
                    Sign in to manage and verify digital evidence.
                </div>

            </div>


            <form action="/auth/login" method="post">

                <!-- EMAIL -->

                <div class="mb-4">

                    <label class="form-label">

                        <i class="bi bi-envelope me-1"></i>
                        Email Address

                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        placeholder="Enter your email"
                        required>

                </div>


                <!-- PASSWORD -->

                <div class="mb-4">

                    <label class="form-label">

                        <i class="bi bi-lock me-1"></i>
                        Password

                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter your password"
                        required>

                </div>


                <!-- LOGIN -->

                <div class="d-grid">

                    <button
                        type="submit"
                        class="btn btn-login btn-lg">

                        <i class="bi bi-box-arrow-in-right me-2"></i>

                        Login

                    </button>

                </div>

            </form>


            <hr class="my-4">

<div class="text-center">

    <p class="mb-2 text-muted">
        Don't have an account?
    </p>

    <a
        href="/auth/register"
        class="btn btn-outline-primary btn-upload">
        <i class="bi bi-person-plus me-1"></i>
        Create Account
    </a>

</div>

        </div>

    </div>


    <div class="footer">

        <i class="bi bi-shield-lock me-1"></i>

        <strong>ForensiChain</strong>

        <br>

        AI-Powered Digital Evidence Investigation Platform

        <br>

        © 2026 ForensiChain

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
