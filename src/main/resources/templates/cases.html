<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Investigation Cases</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="d-flex justify-content-between mb-4">

<h2>Investigation Cases</h2>

<a
href="/cases/new"
class="btn btn-primary">

New Case

</a>

</div>

<table class="table table-bordered table-hover bg-white">

<thead class="table-dark">

<tr>

<th>ID</th>

<th>Case Number</th>

<th>Title</th>

<th>Type</th>

<th>Priority</th>

<th>Status</th>

<th>Officer</th>

</tr>

</thead>

<tbody>

<tr th:each="c : ${cases}">

<td th:text="${c.id}"></td>


<td>

<a
th:href="@{/cases/{id}(id=${c.id})}"
th:text="${c.caseNumber}">

</a>

</td>

<td th:text="${c.title}"></td>

<td th:text="${c.caseType}"></td>

<td th:text="${c.priority}"></td>

<td th:text="${c.status}"></td>

<td th:text="${c.assignedOfficer}"></td>

</tr>

</tbody>

</table>

</div>

</body>

</html>
