<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Create Investigation Case</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h3>Create Investigation Case</h3>

</div>

<div class="card-body">

<form th:action="@{/cases/save}" th:object="${caseObj}" method="post">

<div class="mb-3">

<label>Case Title</label>

<input
class="form-control"
th:field="*{title}"
required>

</div>

<div class="mb-3">

<label>Description</label>

<textarea
class="form-control"
rows="4"
th:field="*{description}">
</textarea>

</div>

<div class="mb-3">

<label>Case Type</label>

<select class="form-select" th:field="*{caseType}">

<option value="Cyber Crime">Cyber Crime</option>

<option value="Financial Fraud">Financial Fraud</option>

<option value="Identity Theft">Identity Theft</option>

<option value="Corporate">Corporate</option>

<option value="Legal">Legal</option>

<option value="Other">Other</option>

</select>

</div>

<div class="mb-3">

<label>Priority</label>

<select class="form-select" th:field="*{priority}">

<option value="LOW">LOW</option>

<option value="MEDIUM">MEDIUM</option>

<option value="HIGH">HIGH</option>

<option value="CRITICAL">CRITICAL</option>

</select>

</div>

<div class="mb-3">

<label>Assigned Officer</label>

<input
class="form-control"
th:field="*{assignedOfficer}">

</div>

<button class="btn btn-success">

Create Case

</button>

<a href="/cases"
class="btn btn-secondary">

View Cases

</a>

</form>

</div>

</div>

</div>

</body>

</html>
