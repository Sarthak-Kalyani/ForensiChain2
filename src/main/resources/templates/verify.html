<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify Evidence | ForensiChain</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <style>

        body {
            background: #eef2f7;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .navbar {
            background: linear-gradient(135deg, #111827, #1e3a8a) !important;
        }

        .verify-card {
            max-width: 600px;
            margin: 70px auto;
            border: none;
            border-radius: 18px;
            overflow: hidden;
        }

        .card-header {
            padding: 20px;
        }

        .form-label {
            font-weight: 600;
        }

        .btn {
            border-radius: 8px;
        }

        .security-icon {
            font-size: 55px;
        }

    </style>

</head>

<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-dark shadow">

    <div class="container">

        <a
            href="/dashboard"
            class="navbar-brand text-white text-decoration-none">

            <i class="bi bi-shield-lock-fill me-2"></i>

            <b>ForensiChain</b>

        </a>

    </div>

</nav>


<!-- ================= VERIFY CARD ================= -->

<div class="container">

    <div class="card verify-card shadow">


        <div class="card-header bg-primary text-white text-center">

            <i class="bi bi-shield-check security-icon"></i>

            <h3 class="mb-0 mt-2">

                Verify Evidence Integrity

            </h3>

            <p class="mb-0 mt-2">

                Verify whether a digital evidence file has been modified.

            </p>

        </div>


        <div class="card-body p-4">


            <form
                id="verifyForm"
                method="get">


                <!-- EVIDENCE ID -->

                <div class="mb-3">

                    <label class="form-label">

                        Evidence ID

                    </label>

                    <input
                        id="evidenceId"
                        class="form-control"
                        type="number"
                        min="1"
                        placeholder="Enter Evidence ID"
                        required>

                </div>


                <!-- USER ID -->

                <div class="mb-4">

                    <label class="form-label">

                        User ID

                    </label>

                    <input
                        class="form-control"
                        type="number"
                        name="userId"
                        min="1"
                        placeholder="Enter User ID"
                        required>

                </div>


                <!-- VERIFY -->

                <div class="d-grid">

                    <button
                        type="submit"
                        class="btn btn-success btn-lg">

                        <i class="bi bi-shield-check me-2"></i>

                        Verify Evidence

                    </button>

                </div>

            </form>


            <hr class="my-4">


            <div class="text-center">

                <a
                    href="/dashboard"
                    class="btn btn-primary me-2">

                    <i class="bi bi-speedometer2 me-1"></i>

                    Dashboard

                </a>


                <a
                    href="/uploadPage"
                    class="btn btn-secondary">

                    <i class="bi bi-upload me-1"></i>

                    Upload Evidence

                </a>

            </div>

        </div>

    </div>

</div>


<script>

    document.getElementById("verifyForm").addEventListener("submit", function(event) {

        event.preventDefault();

        const evidenceId =
            document.getElementById("evidenceId").value;

        this.action =
            "/evidence/verify/" + evidenceId;

        this.submit();

    });

</script>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
