<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>ForensiChain Investigation Workspace</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
background:#eef2f7;
font-family:Segoe UI,Tahoma,sans-serif;
}

.card{
border:none;
border-radius:18px;
}

.card-header{
border-radius:18px 18px 0 0!important;
}

.stat-card{
transition:.3s;
}

.stat-card:hover{
transform:translateY(-5px);
}

.search-box{
max-width:320px;
}

.table td{
vertical-align:middle;
}

.workspace-title{
font-weight:700;
font-size:28px;
}

</style>

</head>

<body>

<nav class="navbar navbar-dark bg-dark shadow">

<div class="container">

<span class="navbar-brand">

<i class="bi bi-shield-lock-fill"></i>

<b>ForensiChain</b>

</span>

</div>

</nav>

<div class="container mt-4">

<div class="row">

<!-- LEFT PANEL -->

<div class="col-lg-4">

<div class="card shadow mb-4">

<div class="card-body">

<h3 class="text-primary"
th:text="${case.caseNumber}"></h3>

<hr>

<p>

<b>Title</b><br>

<span th:text="${case.title}"></span>

</p>

<p>

<b>Description</b><br>

<span th:text="${case.description}"></span>

</p>

<p>

<b>Case Type</b><br>

<span th:text="${case.caseType}"></span>

</p>

<p>

<b>Priority</b><br>

<span class="badge bg-danger"
th:text="${case.priority}"></span>

</p>

<p>

<b>Status</b><br>

<span class="badge bg-success"
th:text="${case.status}"></span>

</p>

<p>

<b>Assigned Officer</b><br>

<span th:text="${case.assignedOfficer}"></span>

</p>

<p>

<b>Created On</b><br>

<span th:text="${case.createdAt}"></span>

</p>

</div>

</div>

<div class="card shadow stat-card">

<div class="card-body text-center">

<h6>Total Evidence</h6>

<h1 class="text-primary"
th:text="${totalEvidence}"></h1>

</div>

</div>

</div>

<!-- RIGHT PANEL -->

<div class="col-lg-8">

<div class="card shadow">

<div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">

<div>

<h4 class="mb-0">

<i class="bi bi-folder2-open"></i>

Evidence Repository

</h4>

</div>

<input
id="searchInput"
class="form-control search-box"
placeholder="🔍 Search evidence...">

</div>

<div class="card-body">

<table
id="evidenceTable"
class="table table-bordered table-hover">

<thead class="table-dark">

<tr>

<th>ID</th>

<th>File Name</th>

<th>Owner</th>

<th>Status</th>

<th width="280">Actions</th>

</tr>

</thead>

<tbody>

<tr th:each="e : ${evidenceList}">

<td th:text="${e.id}"></td>

<td>

<i class="bi bi-file-earmark-text text-primary"></i>

<span th:text="${e.fileName}"></span>

</td>

<td>

User

<span th:text="${e.userId}"></span>

</td>

<td>

<span class="badge bg-success"
th:text="${e.status}"></span>

</td>

<td>

<a
class="btn btn-primary btn-sm"
th:href="@{/evidence/{id}(id=${e.id})}">

<i class="bi bi-eye"></i>

View

</a>

<a
class="btn btn-success btn-sm"
th:href="@{/evidence/download/{id}(id=${e.id},userId=${e.userId})}">

<i class="bi bi-download"></i>

Download

</a>

<a
class="btn btn-danger btn-sm"
onclick="return confirm('Are you sure you want to delete this evidence?')"
th:href="@{/evidence/delete/{id}(id=${e.id},userId=${e.userId})}">

<i class="bi bi-trash"></i>

Delete

</a>

</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>

</div>

<div class="mt-4 d-flex justify-content-between">

<div class="d-flex gap-2">

<a
href="/cases"
class="btn btn-secondary">

⬅ Back to Cases

</a>

<a
th:href="@{/report/case/{id}(id=${case.id})}"
class="btn btn-danger">

<i class="bi bi-file-earmark-pdf-fill"></i>

Generate PDF Report

</a>

<a
th:href="@{/ai/summary/{id}(id=${case.id})}"
class="btn btn-success">

<i class="bi bi-robot"></i>

Generate AI Summary

</a>

</div>

<a
href="/dashboard"
class="btn btn-dark">

<i class="bi bi-speedometer2"></i>

Dashboard

</a>

</div>

</div>

<script>

const input=document.getElementById("searchInput");

input.addEventListener("keyup",function(){

let filter=this.value.toLowerCase();

let rows=document.querySelectorAll("#evidenceTable tbody tr");

rows.forEach(function(row){

let text=row.innerText.toLowerCase();

row.style.display=text.includes(filter)?"":"none";

});

});

</script>

</body>

</html>
